<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tektos — Hermes GUI Demo</title>
  <style>
    :root {
      --bg: #0a0e14;
      --bg-2: #0d1117;
      --bg-3: #161b22;
      --surface: #161b22;
      --surface-hover: #1c2333;
      --surface-active: #1a2332;
      --border: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --text-tertiary: #484f58;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --warning: #d29922;
      --destructive: #f85149;
      --midground: #8b949e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      height: 48px;
      min-height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
    }

    .btn-new {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-new:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 2px;
    }

    .session-item:hover {
      background: var(--surface-hover);
    }

    .session-item.active {
      background: rgba(88, 166, 255, 0.1);
      border-left: 2px solid var(--accent);
    }

    .session-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sidebar-footer {
      height: 48px;
      min-height: 48px;
      border-top: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-footer span {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* ── Main Area ───────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Terminal ────────────────────────────────────────────── */
    .terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .terminal-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #000;
    }

    .terminal-host {
      position: absolute;
      inset: 0;
      padding: 8px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.15;
      color: #f0e6d2;
      overflow: hidden;
    }

    .terminal-host .line {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .terminal-host .prompt {
      color: #3fb950;
    }

    .terminal-host .output {
      color: #f0e6d2;
    }

    .terminal-host .error {
      color: #f85149;
    }

    .terminal-host .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #f0e6d2;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Overlays ────────────────────────────────────────────── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .overlay-content {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Banner ──────────────────────────────────────────────── */
    .banner {
      padding: 8px 12px;
      background: rgba(210, 153, 34, 0.1);
      border-top: 1px solid rgba(210, 153, 34, 0.2);
      font-size: 12px;
      color: #d29922;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .banner button {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #d29922;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }

    .banner button:hover {
      color: #e3b341;
    }

    /* ── Chat Sidebar ────────────────────────────────────────── */
    .chat-sidebar {
      width: 280px;
      min-width: 280px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .model-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .model-info {
      min-width: 0;
      flex: 1;
    }

    .model-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .model-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-success {
      background: rgba(63, 185, 80, 0.1);
      color: var(--success);
    }

    .badge-warning {
      background: rgba(210, 153, 34, 0.1);
      color: var(--warning);
    }

    .badge-secondary {
      background: rgba(139, 148, 158, 0.1);
      color: var(--text-muted);
    }

    .status-strip {
      padding: 8px 12px;
      color: var(--text-secondary);
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.08em;
    }

    .status-strip p {
      margin-bottom: 4px;
    }

    .status-strip .label {
      color: var(--text-muted);
    }

    .status-strip .value {
      font-weight: 500;
    }

    .status-strip .value.success {
      color: var(--success);
    }

    .status-strip .value.muted {
      color: var(--text-muted);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }

    .footer a {
      font-size: 11px;
      color: var(--midground);
      text-decoration: none;
      letter-spacing: 0.12em;
      transition: opacity 0.15s;
    }

    .footer a:hover {
      opacity: 0.9;
    }

    /* ── Demo Controls ───────────────────────────────────────── */
    .demo-controls {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .demo-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .demo-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .demo-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Sessions</h2>
        <button class="btn-new" title="New session">+</button>
      </div>
      <div class="sidebar-content" id="session-list">
        <!-- Sessions populated by JS -->
      </div>
      <div class="sidebar-footer">
        <span id="session-count">0 sessions</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="terminal-container">
        <div class="terminal-wrapper">
          <div class="terminal-host" id="terminal">
            <!-- Terminal content populated by JS -->
          </div>
        </div>
        <div class="banner" id="banner" style="display: none;">
          <span id="banner-text"></span>
          <button onclick="reconnect()">
            ↻ Reconnect
          </button>
        </div>
      </div>
    </main>

    <!-- Chat Sidebar -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar-content">
        <div class="model-card">
          <div class="model-info">
            <div class="model-label">model</div>
            <div class="model-name" id="model-name">Qwen3.6-35B-A3B</div>
          </div>
          <span class="badge badge-success" id="connection-badge">live</span>
        </div>

        <div class="status-strip">
          <p>
            <span class="label">Gateway</span>
            <span class="value success">Running</span>
          </p>
          <p>
            <span class="label">Sessions</span>
            <span class="value">3</span>
          </p>
        </div>
      </div>

      <div class="footer">
        <span>v0.1.0</span>
        <a href="https://nousresearch.com" target="_blank">Nous Research</a>
      </div>
    </aside>
  </div>

  <!-- Demo Controls -->
  <div class="demo-controls">
    <button class="demo-btn active" onclick="setDemoMode('live')">Live Terminal</button>
    <button class="demo-btn" onclick="setDemoMode('connecting')">Connecting</button>
    <button class="demo-btn" onclick="setDemoMode('ended')">Ended</button>
    <button class="demo-btn" onclick="setDemoMode('error')">Error</button>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────
    let demoMode = 'live';
    let terminalLines = [];
    let sessionCounter = 0;

    // ── Demo Sessions ──────────────────────────────────────────
    const demoSessions = [
      { id: 'sess-1', title: 'Debug SSE streaming', time: '2m ago', msgs: 12 },
      { id: 'sess-2', title: 'Fix frontend build', time: '15m ago', msgs: 8 },
      { id: 'sess-3', title: 'Implement ChatPage', time: '1h ago', msgs: 24 },
      { id: 'sess-4', title: 'GPU benchmark results', time: '3h ago', msgs: 5 },
      { id: 'sess-5', title: 'Archive: old experiment', time: '2d ago', msgs: 3 },
    ];

    // ── Terminal Output ────────────────────────────────────────
    const demoOutput = [
      { type: 'prompt', text: 'user@tektos:~$ ' },
      { type: 'output', text: 'Welcome to Tektos-Ultima v1' },
      { type: 'output', text: 'Type /help for available commands' },
      { type: 'output', text: '' },
      { type: 'prompt', text: 'agent> Analyzing request...' },
      { type: 'output', text: 'Processing... [████████████████] 100%' },
      { type: 'output', text: 'Done. Here\'s what I found:' },
      { type: 'output', text: '' },
      { type: 'output', text: '  • 3 sessions active' },
      { type: 'output', text: '  • GPU: RTX 5090 (32GB VRAM)' },
      { type: 'output', text: '  • Model: Qwen3.6-35B-A3B (Q5_K_M)' },
      { type: 'output', text: '' },
      { type: 'prompt', text: 'agent> Ready for your next task.' },
    ];

    // ── Render Functions ───────────────────────────────────────
    function renderSessions() {
      const list = document.getElementById('session-list');
      list.innerHTML = demoSessions.map((s, i) => `
        <div class="session-item ${i === 0 ? 'active' : ''}" onclick="selectSession(${i})">
          <div class="session-title">${s.title}</div>
          <div class="session-meta">${s.time} · ${s.msgs} msgs</div>
        </div>
      `).join('');
      document.getElementById('session-count').textContent = `${demoSessions.length} session${demoSessions.length !== 1 ? 's' : ''}`;
    }

    function selectSession(idx) {
      document.querySelectorAll('.session-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
    }

    function renderTerminal() {
      const terminal = document.getElementById('terminal');
      let html = '';

      demoOutput.forEach(line => {
        if (line.type === 'prompt') {
          html += `<span class="prompt">${line.text}</span>`;
        } else {
          html += `<span class="output">${line.text}</span>`;
        }
        html += '\n';
      });

      html += '<span class="prompt">user@tektos:~$ </span><span class="cursor"></span>';
      terminal.innerHTML = html;
    }

    function setDemoMode(mode) {
      demoMode = mode;
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(mode));
      });

      const badge = document.getElementById('connection-badge');
      const banner = document.getElementById('banner');
      const bannerText = document.getElementById('banner-text');
      const terminal = document.getElementById('terminal');

      // Reset
      badge.className = 'badge';
      banner.style.display = 'none';
      terminal.style.display = 'block';

      switch (mode) {
        case 'live':
          badge.classList.add('badge-success');
          badge.textContent = 'live';
          renderTerminal();
          break;

        case 'connecting':
          badge.classList.add('badge-warning');
          badge.textContent = 'connecting';
          terminal.innerHTML = `
            <div class="overlay">
              <div class="overlay-content">
                <div class="spinner"></div>
                <div>Connecting to terminal…</div>
              </div>
            </div>
          `;
          break;

        case 'ended':
          badge.classList.add('badge-secondary');
          badge.textContent = 'closed';
          terminal.innerHTML = `
            <div class="overlay">
              <div class="overlay-content">
                <div style="font-size: 18px; margin-bottom: 16px; color: rgba(255,255,255,0.9);">Session ended</div>
                <button class="demo-btn" onclick="setDemoMode('live')">Start new session</button>
              </div>
            </div>
          `;
          break;

        case 'error':
          badge.classList.add('badge-warning');
          badge.textContent = 'error';
          banner.style.display = 'flex';
          bannerText.textContent = 'Connection lost. Click \'Reconnect\' to try again.';
          renderTerminal();
          break;
      }
    }

    function reconnect() {
      setDemoMode('live');
    }

    // ── Initialize ─────────────────────────────────────────────
    renderSessions();
    renderTerminal();
    setDemoMode('live');

    // ── Simulate live typing ───────────────────────────────────
    let lineIndex = 0;
    setInterval(() => {
      if (demoMode !== 'live') return;
      if (lineIndex < demoOutput.length) {
        const terminal = document.getElementById('terminal');
        const line = demoOutput[lineIndex];
        const span = document.createElement('span');
        span.className = line.type === 'prompt' ? 'prompt' : 'output';
        span.textContent = line.text;
        terminal.insertBefore(span, terminal.lastElementChild);
        terminal.innerHTML = terminal.innerHTML.replace(/\n$/, '') + '\n';
        lineIndex++;
      }
    }, 300);
  </script>
</body>
</html>
