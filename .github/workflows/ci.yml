# This is a GitHub Actions workflow file.
# Runs on push and pull requests to main.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff lint
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  python-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [python-lint, python-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        run: npm run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        # Warnings track pre-existing typing debt — see docs/history/eslint-debt.md.
        # CI fails only on hard errors (require() in app code, unescaped JSX
        # entities, etc.) so drift is caught without blocking on legacy warns.
        run: npx eslint .

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-lint, python-typecheck, python-tests, frontend-build, frontend-lint, frontend-e2e]
    if: always()
    steps:
      - name: Check results
        env:
          PYTHON_LINT: ${{ needs.python-lint.result }}
          PYTHON_TYPECHECK: ${{ needs.python-typecheck.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          FRONTEND_LINT: ${{ needs.frontend-lint.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
        run: |
          echo "=== CI Results ==="
          echo "python-lint:      ${PYTHON_LINT}"
          echo "python-typecheck: ${PYTHON_TYPECHECK}"
          echo "python-tests:     ${PYTHON_TESTS}"
          echo "frontend-build:   ${FRONTEND_BUILD}"
          echo "frontend-lint:    ${FRONTEND_LINT}"
          echo "frontend-e2e:     ${FRONTEND_E2E}"
          # Summary is informational only — it must not gate on itself.
          echo "All jobs completed."
