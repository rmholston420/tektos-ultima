[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tektos-ultima"
version = "0.1.0"
description = "Self-improving local coding agent with browser GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
gpu = [
    "pynvml>=11.5.0",
]
voice = [
    # STT: faster-whisper wraps whisper.cpp; large-v3-turbo is the target.
    "faster-whisper>=1.0.0",
    # TTS: Microsoft Edge neural voices via edge-tts.
    "edge-tts>=6.1.9",
    # Audio format conversion used before feeding audio into Whisper.
    "pydub>=0.25.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Optional runtime deps that some tests import directly. Keeping them in
    # `dev` means CI can exercise the gateway and eval paths without forcing
    # end users to install them for a plain Tektos install.
    "aiogram>=3.0.0",
    "requests>=2.31.0",
    # Voice test doubles patch symbols from the voice extra; keep parity so
    # `pip install -e .[dev]` exercises the full test suite.
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.9",
    "pydub>=0.25.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tektos"]

[project.scripts]
tektos = "tektos.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100
# Exclude test files from some rules (assertions are fine in tests)
exclude = ["tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = [
    "E501",   # line-too-long — line-length=100 is a soft target only
    "E402",   # module-not-at-top — test files legitimately reorder for mocks
    "SIM102", # collapsible-if — often less readable when combined
    "SIM103", # needless-bool — early returns can be clearer
    "SIM105", # suppressible-exception — contextlib.suppress hides intent
    "SIM108", # if-else-block-instead-of-if-exp — long ternaries hurt readability
    "SIM113", # enumerate-for-loop — explicit counters are sometimes clearer
    "SIM117", # multiple-with-statements — nested with reads better sometimes
]

[tool.ruff.lint.per-file-ignores]
"src/tektos/migrations/schema_evolution.py" = ["S608"]  # SQL strings are parameterized by design

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# strict = true was blocking CI with ~1100 no-untyped-def findings across an
# active codebase that has many FastAPI endpoints without return annotations.
# We keep the highest-value strict subset and re-enable strict per-package as
# the code base is annotated.
strict = false
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
warn_no_return = true
check_untyped_defs = false
allow_untyped_defs = true
allow_untyped_calls = true
allow_redefinition = true
# Skip modules that are known type-noisy pending focused cleanup passes.
# Every excluded path is tracked in docs/history/mypy-debt.md.
exclude = [
    '^src/tektos/main\.py$',
    '^src/tektos/runtime/sdk\.py$',
]

[[tool.mypy.overrides]]
module = [
    "tektos.skills.manager",
    "tektos.self_modification.*",
    "tektos.self_improvement.engine",
    "tektos.runtime.immune_system",
    "tektos.runtime.multi_agent_orchestrator",
    "tektos.runtime.hooks",
    "tektos.runtime.conversation_compressor",
    "tektos.runtime.rag_retriever",
    "tektos.runtime.inference_engine",
    "tektos.schema_evolution",
    "tektos.db_manager",
    "tektos.gateway_adapter",
    "tektos.gateway_proxy",
    "tektos.mcp_server",
    "tektos.metabolism",
    "tektos.routing",
    "tektos.repograph.core",
    "tektos.self_repair.strategies",
    "tektos.self_repair.engine",
    "tektos.agents.planner.spec_generator",
    "tektos.agents.planner.repo_map",
    "tektos.telegram_gateway",
]
ignore_errors = true
