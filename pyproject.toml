[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tektos-ultima"
version = "0.1.0"
description = "Self-improving local coding agent with browser GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tektos"]

[project.scripts]
tektos = "tektos.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100
# Exclude test files from some rules (assertions are fine in tests)
exclude = ["tests/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501", "E402"]  # E501=line-too-long, E402=module-not-at-top (for test mocks)

[tool.ruff.lint.per-file-ignores]
"src/tektos/migrations/schema_evolution.py" = ["S608"]  # SQL strings are parameterized by design

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
